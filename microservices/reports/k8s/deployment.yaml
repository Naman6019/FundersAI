apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports-service
  labels:
    app: reports-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reports-service
  template:
    metadata:
      labels:
        app: reports-service
    spec:
      containers:
      - name: reports-service
        image: fundersai-reports:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        env:
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: reports-secrets
              key: SUPABASE_URL
        - name: SUPABASE_SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: reports-secrets
              key: SUPABASE_SERVICE_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: reports-secrets
              key: OPENAI_API_KEY
        - name: REPORTS_INTERNAL_PROXY_KEY
          valueFrom:
            secretKeyRef:
              name: reports-secrets
              key: REPORTS_INTERNAL_PROXY_KEY
        # Optional but recommended: without these, rate limiting falls back to
        # a per-pod in-memory counter, which is looser than the intended limit
        # across the 2 replicas below.
        - name: UPSTASH_REDIS_REST_URL
          valueFrom:
            secretKeyRef:
              name: reports-secrets
              key: UPSTASH_REDIS_REST_URL
              optional: true
        - name: UPSTASH_REDIS_REST_TOKEN
          valueFrom:
            secretKeyRef:
              name: reports-secrets
              key: UPSTASH_REDIS_REST_TOKEN
              optional: true
