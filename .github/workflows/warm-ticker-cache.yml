name: Warm Ticker Cache

on:
  schedule:
    # Runs every 30 minutes to keep Next.js Data Cache fresh
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Ticker API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "https://www.fundersai.co.in/api/funds/ticker")
          echo "Warm up status: $response"
          if [ "$response" != "200" ]; then
            echo "WARNING: API returned $response"
            exit 1
          fi
